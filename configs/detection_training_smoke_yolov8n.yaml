# YOLOv8n Smoke Training (2 epochs) - BENCHMARK DETECTOR
backend: yolov8n
model: yolov8n.pt
project: artifacts/detection_smoke
name: smoke-yolov8n

train:
  epochs: 2
  imgsz: 320
  batch: 16
  workers: 2
  patience: 10
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  weight_decay: 0.0005
  seed: 42
  deterministic: true
  device: auto
