# YOLOv8n Pilot V3 Fine-Tuning Configuration (Prepared for PM Sign-Off — NOT EXECUTED)
# Preserves E1 baseline checkpoint untouched; writes to isolated pilot output directory.
# Verified Hardware Target: NVIDIA GeForce RTX 2050 (4095.5 MB VRAM)

task: detect
mode: train
model: artifacts/detection_v2/E1_yolov8n_10cls/weights/best.pt
data: configs/detection_dataset_real_v3_pilot.yaml

# Training Hyperparameters (Conservative Fine-Tuning for NVIDIA GeForce RTX 2050 4GB VRAM)
epochs: 25
patience: 5
batch: 4
imgsz: 512
device: 0
workers: 2
amp: true
cache: false

# Optimizer & Learning Rate Schedule
optimizer: AdamW
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
cos_lr: true

# Augmentation Controls (Preserve Full-Battery Geometry)
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.3
degrees: 10.0
translate: 0.1
scale: 0.3
shear: 0.0
perspective: 0.0
flipud: 0.2
fliplr: 0.5
mosaic: 0.5
mixup: 0.0

# Output & Reproducibility (Hyperparameter selection uses val split only; test/holdout never touched)
project: artifacts/detection_v3_pilot
name: E3_yolov8n_pilot
exist_ok: false
pretrained: true
seed: 42
deterministic: true
save: true
save_period: -1
val: true
plots: true
