# configs/detection_source_mapping.yaml
# Taxonomy and Source Label Mapping for Multi-Object Waste Detection
# Project: CNTT-KLCN155 Waste Detection

project_taxonomy:
  0: battery
  1: biological
  2: cardboard
  3: clothes
  4: glass
  5: metal
  6: paper
  7: plastic
  8: shoes
  9: trash

acceptance_criteria:
  min_box_area_normalized: 0.0001
  max_box_area_normalized: 1.0000
  allowed_out_of_bounds_margin: 0.05
  min_dimension_normalized: 0.002
  duplicate_iou_threshold: 0.98
  require_material_clarity: true
  exclude_in_use_person_clothing: true

sources:
  taco:
    version: "v0.1"
    official_url: "https://github.com/pedropro/TACO"
    annotations_url: "https://raw.githubusercontent.com/pedropro/TACO/master/data/annotations.json"
    license: "CC BY 4.0 / Flickr CC"
    annotation_type: "COCO Bounding Box [x, y, w, h] + Polygon Segmentation"
    category_mapping:
      # Class 0: battery
      1: { name: "Battery", class_id: 0, class_name: "battery", status: "CONFIRMED" }
      # Class 1: biological
      25: { name: "Food waste", class_id: 1, class_name: "biological", status: "CONFIRMED" }
      # Class 2: cardboard
      13: { name: "Toilet tube", class_id: 2, class_name: "cardboard", status: "CONFIRMED" }
      14: { name: "Other carton", class_id: 2, class_name: "cardboard", status: "CONFIRMED" }
      15: { name: "Egg carton", class_id: 2, class_name: "cardboard", status: "CONFIRMED" }
