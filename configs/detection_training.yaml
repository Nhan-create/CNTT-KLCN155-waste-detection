# SSDLite320-MobileNetV3 - MÔ HÌNH CHÍNH (PRIMARY DETECTOR) THEO ĐỀ CƯƠNG KHÓA LUẬN
backend: ssdlite
model: ssdlite320_mobilenet_v3_large
pretrained: true
backbone_weights: artifacts/official_run/best_model.pt
project: artifacts/detection
name: waste-ssdlite320-mobilenetv3

train:
  epochs: 120
  imgsz: 320
  batch: 8
  workers: 4
  patience: 30
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  weight_decay: 0.0005
  clip_grad_norm: 10.0
  freeze_bn: true
  amp: true
  seed: 42
  deterministic: true
  device: auto
